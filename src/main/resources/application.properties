spring.application.name=student-management-system
server.port=8092
spring.datasource.url=jdbc:mysql://localhost:3306/schooldata_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
#FILTER + PAGINATION API
student.pagination.default-page-size=15
student.default-year-window=1
student.filter.partial-course-match=true
#PROMOTE STUDENT API
student.promotion.min-marks=40.0
student.promotion.allow-skip=false
student.max-year=4
